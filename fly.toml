# Kisan Direct AI — Fly.io app config.
# Single app: FastAPI backend serves the API and the marketplace frontend
# from the same origin, SQLite on a persistent volume. See DEPLOYMENT.md.
# Secrets are NOT in this file. Set them with:
#   fly secrets set KISAN_SECRET_KEY="$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')" KISAN_CORS_ORIGINS="https://kisan-direct-ai.fly.dev"
# (Replace the app name / URL below with the real one after `fly launch`.)

app = "kisan-direct-ai"
primary_region = "bom"

[build]
  dockerfile = "mvp/backend/Dockerfile"

[env]
  KISAN_ENV = "production"
  KISAN_SERVE_FRONTEND = "1"
  KISAN_DB_PATH = "/data/kisan_direct.db"
  KISAN_SEED_DEMO_DATA = "0"
  KISAN_ENABLE_DOCS = "0"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "60s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[mounts]]
  source = "kisan_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
