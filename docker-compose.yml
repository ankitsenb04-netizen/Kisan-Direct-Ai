# Kisan Direct AI — production-like compose (single service).
# The backend serves the API and the frontend from the same origin.
#   docker compose up --build
# Secrets: put KISAN_SECRET_KEY in a .env file next to this file (never
# commit it) or export it before running compose. Compose reads .env
# automatically for ${...} substitution.
# Local two-server dev (backend on :8000, frontend on :5500) is NOT this
# file: use docker-compose.override.yml, or the venv instructions in
# the root README.
services:
  backend:
    build:
      context: .
      dockerfile: mvp/backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      KISAN_ENV: production
      # Empty here is fine: in production the app itself refuses to start
      # without a real secret (fail fast, clear error in the logs).
      KISAN_SECRET_KEY: ${KISAN_SECRET_KEY:-}
      KISAN_CORS_ORIGINS: ${KISAN_CORS_ORIGINS:-http://127.0.0.1:8000}
      KISAN_SEED_DEMO_DATA: ${KISAN_SEED_DEMO_DATA:-0}
      KISAN_ENABLE_DOCS: ${KISAN_ENABLE_DOCS:-0}
      KISAN_SERVE_FRONTEND: "1"
      KISAN_DB_PATH: /data/kisan_direct.db
    volumes:
      - kisan-data:/data
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

volumes:
  kisan-data:
